<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>{{ lang_name }} Translation</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0a0f; --surface:#13131a; --border:#2a2a3a; --accent:#7c6af7; --text:#fff; --muted:#6b6b80; --green:#22c55e; --yellow:#facc15; --red:#ef4444; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; display:flex; flex-direction:column; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:0.9rem 1.25rem; border-bottom:1px solid var(--border); flex-shrink:0; }
  .brand { display:flex; align-items:center; gap:0.5rem; font-size:0.85rem; font-weight:600; }
  .badge { background:var(--accent); color:#fff; padding:0.2rem 0.65rem; border-radius:99px; font-size:0.72rem; font-weight:700; }
  .topbar-right { display:flex; align-items:center; gap:0.75rem; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0; }
  .dot.live { background:var(--green); box-shadow:0 0 8px var(--green); animation:pulse 1.4s infinite; }
  .dot.err  { background:var(--red); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .back { font-size:0.75rem; color:var(--muted); text-decoration:none; }
  #unlock { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.5rem; padding:2rem; text-align:center; }
  .icon { font-size:4rem; }
  .unlock-title { font-size:1.4rem; font-weight:700; }
  .unlock-sub { font-size:0.88rem; color:var(--muted); line-height:1.7; max-width:280px; }
  .unlock-btn { background:var(--accent); color:#fff; border:none; border-radius:14px; padding:1rem 2.5rem; font-size:1.1rem; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif; width:100%; max-width:300px; transition:opacity 0.2s; }
  .unlock-btn:active { opacity:0.8; }
  #listener { display:none; flex:1; flex-direction:column; }
  .main-box { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem 1.5rem; text-align:center; }
  .lang-label { font-size:0.68rem; letter-spacing:0.15em; text-transform:uppercase; color:var(--muted); margin-bottom:1rem; }
  .translation { font-size:clamp(1.7rem,5.5vw,3rem); line-height:2; color:var(--yellow); min-height:4rem; transition:opacity 0.25s; }
  .translation.rtl { font-family:'Noto Nastaliq Urdu',serif; direction:rtl; }
  .english { font-size:clamp(0.8rem,2.5vw,1rem); color:var(--muted); margin-top:1.25rem; line-height:1.5; max-width:460px; }
  .waiting { color:var(--muted); font-size:0.95rem; font-family:'Inter',sans-serif; }
  .bottombar { padding:0.9rem 1.25rem; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .status-txt { font-size:0.78rem; color:var(--muted); }
  .seg-count  { font-size:0.72rem; color:var(--muted); }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">🎙 Live Translation <span class="badge">{{ lang_name }}</span></div>
  <div class="topbar-right">
    <a href="/listen" class="back">← Languages</a>
    <div class="dot" id="dot"></div>
  </div>
</div>

<div id="unlock">
  <div class="icon">🔊</div>
  <div class="unlock-title">{{ lang_name }} Translation</div>
  <div class="unlock-sub">Tap below to start listening.<br><br>Make sure your <strong>volume is up</strong> and you are connected to <strong>church WiFi</strong>.</div>
  <button class="unlock-btn" onclick="unlockAndStart()">Tap to Listen</button>
</div>

<div id="listener">
  <div class="main-box">
    <div class="lang-label">{{ lang_name|upper }} TRANSLATION</div>
    <div class="translation {% if lang_code in ['ur','ar'] %}rtl{% endif %}" id="translation">
      <span class="waiting">Waiting for speaker...</span>
    </div>
    <div class="english" id="english"></div>
  </div>
  <div class="bottombar">
    <div class="status-txt" id="status-txt">Connecting...</div>
    <div class="seg-count" id="seg-count"></div>
  </div>
</div>

<script>
var LANG_CODE     = "{{ lang_code }}";
var LANG_PATH     = window.location.pathname.replace("/","");
var audioCtx      = null;
var audioUnlocked = false;
var audioQueue    = [];
var audioPlaying  = false;
var segments      = 0;

function unlockAndStart() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  var buf = audioCtx.createBuffer(1,1,22050);
  var src = audioCtx.createBufferSource();
  src.buffer = buf; src.connect(audioCtx.destination); src.start(0);
  audioUnlocked = true;
  // Request wake lock to keep screen on
  if ("wakeLock" in navigator) {
    navigator.wakeLock.request("screen").catch(function(){});
  }
  document.getElementById("unlock").style.display   = "none";
  document.getElementById("listener").style.display = "flex";
  connectSSE();
}

function connectSSE() {
  var es = new EventSource("/stream?lang=" + LANG_PATH);
  es.onmessage = function(ev) {
    var d = JSON.parse(ev.data);
    if (d.type === "ping") return;
    if (d.type === "init") {
      document.getElementById("status-txt").textContent = "Connected - listening...";
      document.getElementById("dot").className = "dot live";
    }
    if (d.type === "status") {
      var labels = { listening:"Listening...", transcribing:"Transcribing...", translating:"Translating...", idle:"Waiting for operator..." };
      document.getElementById("status-txt").textContent = labels[d.status] || d.status;
    }
    if (d.type === "transcript" && d.lang === LANG_CODE) {
      showTranslation(d);
      segments++;
      document.getElementById("seg-count").textContent = segments + " segments";
    }
    if (d.type === "audio" && d.lang === LANG_CODE) {
      enqueueAudio(d.data);
    }
    if (d.type === "error") {
      document.getElementById("dot").className = "dot err";
    }
  };
  es.onerror = function() {
    document.getElementById("status-txt").textContent = "Reconnecting...";
    document.getElementById("dot").className = "dot";
    setTimeout(connectSSE, 3000);
  };
}

function showTranslation(entry) {
  var tr = document.getElementById("translation");
  var en = document.getElementById("english");
  tr.style.opacity = "0";
  setTimeout(function() {
    tr.innerHTML    = entry.translated || "";
    en.textContent  = entry.english    || "";
    tr.style.opacity = "1";
  }, 200);
}

function enqueueAudio(b64) {
  audioQueue.push(b64);
  if (!audioPlaying) playNext();
}

function playNext() {
  if (!audioUnlocked || audioQueue.length === 0) { audioPlaying=false; return; }
  audioPlaying = true;
  var b64 = audioQueue.shift();
  var bin = atob(b64);
  var buf = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
  audioCtx.decodeAudioData(buf.buffer,
    function(ab) {
      var src = audioCtx.createBufferSource();
      src.buffer = ab; src.connect(audioCtx.destination);
      src.onended = function() { audioPlaying=false; playNext(); };
      src.start(0);
    },
    function() { audioPlaying=false; playNext(); }
  );
}
</script>
</body>
</html>
